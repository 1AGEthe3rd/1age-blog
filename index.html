<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>1AGE Blog · World Platform</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#e2ffdc}
    body{overscroll-behavior:none;touch-action:none}
    main{position:fixed;inset:0;background:#000}
    iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#000}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <main aria-label="1AGE Blog three-dimensional platform">
    <iframe title="1AGE Blog platform in 1AGE World" src="https://1age.world/?platform=blog" allow="autoplay; fullscreen; gamepad" allowfullscreen loading="eager"></iframe>
    <p class="sr-only">The 1AGE Blog experience is a shared interactive 3D World. Touch the joystick gamepad or use a connected controller.</p>
  </main>
  <noscript><a href="https://1age.world/?platform=blog">Open the 1AGE Blog platform</a></noscript>
</body>
</html>
